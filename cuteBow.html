<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Bestie 🎀</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffeef2;
            background-image: radial-gradient(#fff0f5 20%, transparent 20%), radial-gradient(#fff0f5 20%, transparent 20%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* Top Header Message */
        .message-container {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .heading {
            font-size: 3.5rem;
            font-family: 'Georgia', serif;
            font-weight: bold;
            color: #ff4d79;
            text-shadow: 0 0 15px rgba(255, 77, 121, 0.4);
            margin: 0;
            animation: pulseText 2s infinite ease-in-out;
        }

        /* Interactive Floating Card Enclosure */
        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 50px 25px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255, 105, 180, 0.15);
            border: 3px dashed #ffb3c6;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 5;
            animation: floatCard 4s infinite ease-in-out;
        }

        /* --- CLICKABLE PINK BOW --- */
        .bow-container {
            position: relative;
            width: 180px;
            height: 140px;
            margin: 10px 0;
            cursor: pointer;
            transition: transform 0.1s ease-in-out;
        }

        .bow-container:active {
            transform: scale(0.85) rotate(3deg);
        }

        /* Bow Details */
        .bow-knot {
            position: absolute;
            top: 40px;
            left: 70px;
            width: 40px;
            height: 40px;
            background: #ff4d79;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(255, 77, 121, 0.3), inset 0 -3px 5px rgba(0,0,0,0.15);
        }

        .bow-loop-left, .bow-loop-right {
            position: absolute;
            top: 15px;
            width: 80px;
            height: 80px;
            background: #ff668c;
            border: 4px solid #ff4d79;
            box-sizing: border-box;
            box-shadow: 0 6px 15px rgba(255, 77, 121, 0.2);
        }

        .bow-loop-left { left: 5px; border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; transform: rotate(-15deg); }
        .bow-loop-right { right: 5px; border-radius: 30% 70% 70% 30% / 70% 70% 30% 30%; transform: rotate(15deg); }

        .bow-loop-left::after, .bow-loop-right::after {
            content: ''; position: absolute; top: 15px; width: 35px; height: 35px; background: #ff85a2; border-radius: 50%;
        }
        .bow-loop-left::after { right: 10px; }
        .bow-loop-right::after { left: 10px; }

        .bow-tail-left, .bow-tail-right { position: absolute; top: 75px; width: 35px; height: 70px; background: #ff4d79; z-index: 2; }
        .bow-tail-left { left: 45px; transform: rotate(25deg); border-radius: 0 0 10px 30px; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 85%, 0 100%); }
        .bow-tail-right { right: 45px; transform: rotate(-25deg); border-radius: 0 0 30px 10px; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 85%, 0 100%); }

        /* Help text under bow */
        .click-hint {
            font-size: 0.95rem;
            color: #ff4d79;
            margin-top: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
            animation: blinkHint 1.5s infinite alternate;
        }

        /* --- SECRET LETTER BOX --- */
        .letter-box {
            max-width: 320px;
            background: #ffffff;
            border: 2px solid #ff4d79;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(255, 77, 121, 0.15);
            display: none; /* Initially hidden */
            text-align: center;
            color: #4a4a4a;
            font-size: 1.05rem;
            line-height: 1.5;
            position: relative;
        }

        .letter-box::before {
            content: '💌';
            font-size: 24px;
            display: block;
            margin-bottom: 5px;
        }

        /* --- FLOATING PARTICLES --- */
        .floating-heart {
            position: absolute;
            color: #ffb3c6;
            font-size: 20px;
            pointer-events: none;
            z-index: 1;
            animation: moveHeart 5s linear infinite;
            bottom: -50px;
        }

        /* --- ANIMATIONS --- */
        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulseText {
            0%, 100% { transform: scale(1); text-shadow: 0 0 15px rgba(255, 77, 121, 0.4); }
            50% { transform: scale(1.03); text-shadow: 0 0 25px rgba(255, 77, 121, 0.7); }
        }

        @keyframes blinkHint {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes moveHeart {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) translateX(var(--randomX)) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Message Section -->
    <div class="message-container">
        <h1 class="heading">I Love You!</h1>
    </div>

    <!-- Main Enclosure -->
    <div class="card">
        <!-- Clickable Bow -->
        <div class="bow-container" onclick="openSurprise()">
            <div class="bow-loop-left"></div>
            <div class="bow-loop-right"></div>
            <div class="bow-knot"></div>
            <div class="bow-tail-left"></div>
            <div class="bow-tail-right"></div>
        </div>
        
        <!-- Hint Text -->
        <div class="click-hint" id="hintText">🎀 Click the bow to open my secret letter! 🎀</div>

        <!-- Secret Letter Box -->
        <div class="letter-box" id="secretLetter"></div>
    </div>

    <!-- Logic Engine -->
    <script>
        function spawnHeart(xPos = null, isBurst = false) {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            
            const shapes = ['❤️', '💖', '✨', '🎀', '🌸', '💕'];
            heart.innerText = shapes[Math.floor(Math.random() * shapes.length)];
            
            const leftPosition = xPos !== null ? xPos : Math.random() * window.innerWidth;
            heart.style.left = leftPosition + 'px';
            
            const size = Math.random() * 20 + 15;
            heart.style.fontSize = size + 'px';
            
            const duration = Math.random() * 3 + 4;
            heart.style.animationDuration = duration + 's';
            
            const drift = (Math.random() * 240 - 120) + 'px';
            heart.style.setProperty('--randomX', drift);

            if (isBurst) {
                heart.style.bottom = '50vh';
                heart.style.animationDuration = (Math.random() * 1.2 + 1.2) + 's';
            }

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Auto background hearts
        setInterval(() => spawnHeart(), 600);

        // Click Action
        let letterOpened = false;
        function openSurprise() {
            // 1. Create burst of hearts
            for (let i = 0; i < 25; i++) {
                const randomOffset = (Math.random() * 200 - 100) + (window.innerWidth / 2);
                spawnHeart(randomOffset, true);
            }

            // 2. Open letter only once
            if (!letterOpened) {
                letterOpened = true;
                document.getElementById('hintText').style.display = 'none'; // Hide hint
                const letter = document.getElementById('secretLetter');
                letter.style.display = 'block'; // Show box
                
                // Typewriter text effect
                const message = "To the absolute best female bestie in the universe! Thank you for always being there for me, for all the laughs, and the endless support. You deserve the world! ✨💖";
                let index = 0;
                
                function typeWriter() {
                    if (index < message.length) {
                        letter.innerHTML += message.charAt(index);
                        index++;
                        setTimeout(typeWriter, 40); // speed of typing
                    }
                }
                typeWriter();
            }
        }
    </script>
</body>
</html>
